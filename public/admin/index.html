<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mix Dashboard — Dubbz Studio</title>
<style>
  :root {
    --navy: #0f0f1a;
    --surface: #141428;
    --border: #2a2a4a;
    --cyan: #00d4ff;
    --gold: #ffd700;
    --red: #ff4757;
    --green: #2ed573;
    --text: #e8e8f0;
    --muted: #8888aa;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--navy); color: var(--text); min-height: 100vh; }
  header { background: var(--surface); border-bottom: 2px solid var(--cyan); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 1.5rem; color: var(--cyan); letter-spacing: 1px; }
  header .badge { background: var(--cyan); color: var(--navy); font-size: 0.7rem; font-weight: 700; padding: 4px 10px; border-radius: 4px; }
  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
  .toolbar { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
  .btn { padding: 10px 18px; border: 2px solid var(--border); background: var(--surface); color: var(--text); font-size: 0.85rem; font-weight: 600; cursor: pointer; border-radius: 6px; transition: 0.2s; font-family: inherit; }
  .btn:hover { border-color: var(--cyan); color: var(--cyan); }
  .btn-primary { background: var(--cyan); color: var(--navy); border-color: var(--cyan); }
  .btn-primary:hover { background: #33ddff; color: var(--navy); }
  .btn-danger:hover { border-color: var(--red); color: var(--red); }
  .btn-gold { background: var(--gold); color: var(--navy); border-color: var(--gold); }
  .btn-gold:hover { background: #ffe44d; color: var(--navy); }
  .btn-sm { padding: 6px 12px; font-size: 0.75rem; }
  .mixes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }
  .mix-card { background: var(--surface); border: 2px solid var(--border); border-radius: 12px; padding: 20px; transition: 0.2s; }
  .mix-card:hover { border-color: var(--cyan); box-shadow: 0 0 20px rgba(0, 212, 255, 0.1); }
  .mix-card.editing { border-color: var(--gold); box-shadow: 0 0 30px rgba(255, 211, 0, 0.15); }
  .mix-header { display: flex; gap: 16px; margin-bottom: 16px; }
  .mix-cover { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; border: 2px solid var(--border); flex-shrink: 0; }
  .mix-cover-placeholder { width: 80px; height: 80px; border-radius: 8px; background: var(--navy); border: 2px dashed var(--border); display: flex; align-items: center; justify-content: center; font-size: 0.65rem; color: var(--muted); text-align: center; flex-shrink: 0; }
  .mix-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
  .mix-date { font-size: 0.75rem; color: var(--muted); }
  .mix-genres { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
  .genre-tag { font-size: 0.7rem; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--cyan); color: var(--cyan); font-weight: 500; }
  .genre-tag.active { background: var(--cyan); color: var(--navy); }
  .mix-meta { font-size: 0.75rem; color: var(--muted); margin-bottom: 12px; line-height: 1.6; }
  .mix-meta strong { color: var(--text); font-weight: 600; }
  .mix-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  /* Edit form */
  .edit-form { display: none; margin-top: 16px; padding-top: 16px; border-top: 2px dashed var(--border); }
  .edit-form.open { display: block; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-group.full { grid-column: 1 / -1; }
  .form-group label { font-size: 0.7rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .form-group input, .form-group select, .form-group textarea {
    padding: 8px 12px; background: var(--navy); border: 1px solid var(--border); color: var(--text);
    font-size: 0.85rem; border-radius: 6px; font-family: inherit;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--cyan); }
  .form-group textarea { resize: vertical; min-height: 60px; }
  .live-toggle { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .live-toggle input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--cyan); cursor: pointer; }
  .live-toggle label { cursor: pointer; font-weight: 600; }
  .genre-picker { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .genre-opt { padding: 4px 10px; border-radius: 4px; border: 1px solid var(--border); font-size: 0.7rem; cursor: pointer; transition: 0.15s; background: var(--navy); }
  .genre-opt:hover { border-color: var(--cyan); }
  .genre-opt.selected { background: var(--cyan); color: var(--navy); border-color: var(--cyan); font-weight: 600; }
  .form-actions { display: flex; gap: 8px; margin-top: 16px; }
  /* Toast */
  .toast { position: fixed; bottom: 24px; right: 24px; padding: 14px 20px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; z-index: 9999; animation: slideIn 0.3s ease; }
  .toast.success { background: var(--green); color: #000; }
  .toast.error { background: var(--red); color: #fff; }
  @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 999; display: none; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border: 2px solid var(--border); border-radius: 12px; padding: 24px; max-width: 500px; width: 90%; }
  .modal h2 { margin-bottom: 16px; color: var(--cyan); }
  .modal pre { background: var(--navy); padding: 16px; border-radius: 8px; font-size: 0.75rem; overflow-x: auto; max-height: 300px; overflow-y: auto; white-space: pre-wrap; border: 1px solid var(--border); }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
  /* Stats */
  .stats { display: flex; gap: 24px; margin-bottom: 24px; }
  .stat { background: var(--surface); border: 2px solid var(--border); border-radius: 10px; padding: 16px 24px; text-align: center; }
  .stat-num { font-size: 2rem; font-weight: 800; color: var(--cyan); }
  .stat-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
  @media (max-width: 640px) {
    .form-row { grid-template-columns: 1fr; }
    .mixes-grid { grid-template-columns: 1fr; }
    .stats { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<header>
  <h1>🎛️ Dubbz Studio — Mix Manager</h1>
  <span class="badge" id="totalBadge">0 mixes</span>
</header>

<div class="container">
  <div class="stats">
    <div class="stat"><div class="stat-num" id="statTotal">0</div><div class="stat-label">Total Mixes</div></div>
    <div class="stat"><div class="stat-num" id="statLive">0</div><div class="stat-label">Live Sets</div></div>
    <div class="stat"><div class="stat-num" id="statFeatured">0</div><div class="stat-label">Featured</div></div>
  </div>

  <div class="toolbar">
    <button class="btn btn-primary" id="btnAddNew">+ New Mix</button>
    <button class="btn" id="btnExportAll">Export All Markdown</button>
    <button class="btn" id="btnFetchAPI">Refresh from API</button>
  </div>

  <div class="mixes-grid" id="mixesGrid"></div>
</div>

<div class="modal-overlay" id="previewModal">
  <div class="modal">
    <h2>Markdown Preview</h2>
    <pre id="previewContent"></pre>
    <div class="modal-actions">
      <button class="btn" id="btnClosePreview">Close</button>
      <button class="btn btn-primary" id="btnCopyMd">Copy</button>
      <button class="btn btn-gold" id="btnDownloadMd">Download .md</button>
    </div>
  </div>
</div>

<script>
let mixes = [];
let editingId = null;
let allGenres = new Set();
const STORAGE_KEY = 'dubbz-mixes-edit';

const GENRE_OPTIONS = [
  'house','deep-house','tech-house','hip-hop','r&b','afrobeats','amapiano',
  'dancehall','reggaeton','bachata','latin','top-40','open-format','trap',
  'kompa','bounce','slow-jams','classics','throwbacks','edm','pop','disco',
  'funk','soul','jazz','reggae','afro-house','techno','dnb','lo-fi'
];

async function init() {
  try {
    const res = await fetch('/api/mixes.json?limit=50');
    if (!res.ok) throw new Error('API not available');
    mixes = await res.json();
  } catch(e) {
    // Load from localStorage or default
    const saved = localStorage.getItem(STORAGE_KEY);
    mixes = saved ? JSON.parse(saved) : getDefaultMixes();
  }
  
  // Deduplicate by title (case-insensitive)
  const seen = new Set();
  mixes = mixes.filter(m => {
    const key = (m.title || '').trim().toLowerCase();
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
  
  mixes.forEach(m => (m.genre || []).forEach(g => allGenres.add(g)));
  render();
}

function getDefaultMixes() {
  return [
    {id:'cultural-council-open-format', title:'Cultural Council - Open Format Mix', description:'Open format set for Cultural Council event', date:'2026-07-16', genre:['hip-hop','r&b','dancehall','top-40','afrobeats'], duration:'2:30:00', trackCount:55, live:true, venue:'Cultural Council', address:'West Palm Beach, FL', coverImage:'/mixes/cultural-council-open-format.webp', audioFile:'/mixes/cultural-council-open-format-2026.mp3', featured:true, downloadable:true, tags:['cultural-council','open-format','live-recording','2026'], bpmRange:'70-130'},
    {id:'avacado-saturday', title:'Avacado Cantina - Saturday Sessions', description:'Weekly residency set at Avacado Cantina', date:'2024-09-05', genre:['house','top-40','latin','afrobeats'], duration:'3:00:00', trackCount:68, live:true, venue:'Avacado Cantina', address:'Palm Beach Gardens, FL', coverImage:'/mixes/avacado-saturday-2024.webp', audioFile:'/mixes/avacado-cantina-latin-2026.mp3', featured:true, downloadable:true, tags:['avacado-cantina','residency','saturday-sessions','weekly'], bpmRange:'100-128'},
    {id:'flavar-summer-2024', title:'FLAVAR Call Collect - Summer 2024', description:'Live set from FLAVAR Call Collect', date:'2024-08-25', genre:['afrobeats','dancehall','hip-hop','house'], duration:'2:15:00', trackCount:45, live:true, venue:'French Grille', address:'Northwood Village, WPB', coverImage:'/mixes/flavar-summer-2024.webp', audioFile:'/mixes/flavar-summer-2024.mp3', featured:true, downloadable:true, tags:['flavar','call-collect','live-set'], bpmRange:'90-128'},
    {id:'wedding-reception-2024', title:'Wedding Reception Mix - Summer 2024', description:'Ceremony to last dance', date:'2024-07-12', genre:['open-format','top-40','classics','slow-jams'], duration:'4:30:00', trackCount:85, live:true, venue:'Private Event', address:'West Palm Beach, FL', coverImage:'/mixes/wedding-reception-2024.webp', audioFile:'/mixes/wedding-reception-2024.mp3', featured:false, downloadable:false, tags:['wedding','ceremony','reception','private-event'], bpmRange:'70-128'}
  ];
}

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(mixes)); }

function render() {
  const grid = document.getElementById('mixesGrid');
  grid.innerHTML = mixes.map(m => renderCard(m)).join('');
  document.getElementById('totalBadge').textContent = mixes.length + ' mixes';
  document.getElementById('statTotal').textContent = mixes.length;
  document.getElementById('statLive').textContent = mixes.filter(m => m.live).length;
  document.getElementById('statFeatured').textContent = mixes.filter(m => m.featured).length;
}

function renderCard(m) {
  const editing = editingId === m.id;
  const coverHtml = m.coverImage ? `<img src="${m.coverImage}" alt="" class="mix-cover" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="mix-cover-placeholder" style="display:none">No Image</div>` : `<div class="mix-cover-placeholder">No Image</div>`;
  const genres = (m.genre || []).map(g => `<span class="genre-tag">${g}</span>`).join('');
  return `<article class="mix-card ${editing ? 'editing' : ''}" data-id="${m.id}">
    <div class="mix-header">${coverHtml}<div><div class="mix-title">${esc(m.title)}</div><div class="mix-date">${esc(m.date || '')}</div></div></div>
    <div class="mix-genres">${genres}</div>
    <div class="mix-meta">
      <strong>Live:</strong> ${m.live ? '✅ ' + esc(m.venue || '') : '❌ Studio'}<br>
      <strong>Duration:</strong> ${esc(m.duration || '-')} · <strong>Tracks:</strong> ${m.trackCount || '-'}<br>
      <strong>BPM:</strong> ${esc(m.bpmRange || '-')} · <strong>Featured:</strong> ${m.featured ? '⭐' : ''}
    </div>
    <div class="mix-actions">
      <button class="btn btn-sm" onclick="startEdit('${m.id}')">Edit</button>
      <button class="btn btn-sm" onclick="previewMd('${m.id}')">Preview .md</button>
      <button class="btn btn-sm btn-danger" onclick="deleteMix('${m.id}')">Delete</button>
    </div>
    ${editing ? renderEditForm(m) : ''}
  </article>`;
}

function renderEditForm(m) {
  const selectedGenres = m.genre || [];
  const genreOpts = GENRE_OPTIONS.map(g => `<span class="genre-opt ${selectedGenres.includes(g) ? 'selected' : ''}" onclick="toggleGenre('${g}')">${g}</span>`).join('');
  return `<form class="edit-form open" onsubmit="saveMix(event,'${m.id}')">
    <div class="form-row"><div class="form-group"><label>Title</label><input name="title" value="${esc(m.title)}"></div><div class="form-group"><label>Date (YYYY-MM-DD)</label><input name="date" type="date" value="${esc(m.date || '')}"></div></div>
    <div class="form-row"><div class="form-group"><label>Duration</label><input name="duration" value="${esc(m.duration || '')}" placeholder="2:30:00"></div><div class="form-group"><label>BPM Range</label><input name="bpmRange" value="${esc(m.bpmRange || '')}" placeholder="90-120"></div></div>
    <div class="form-row"><div class="form-group"><label>Track Count</label><input name="trackCount" type="number" value="${m.trackCount || ''}"></div><div class="form-group"><label>Audio File Path</label><input name="audioFile" value="${esc(m.audioFile || '')}" placeholder="/mixes/name.mp3"></div></div>
    <div class="form-row"><div class="form-group"><label>Cover Image Path</label><input name="coverImage" value="${esc(m.coverImage || '')}" placeholder="/mixes/name.webp"></div><div class="form-group"><label>Tags (comma-separated)</label><input name="tags" value="${(m.tags || []).join(', ')}"></div></div>
    <div class="form-group full"><label>Description</label><textarea name="description">${esc(m.description || '')}</textarea></div>
    <div class="live-toggle"><input type="checkbox" id="live-${m.id}" ${m.live ? 'checked' : ''} onchange="toggleLive('${m.id}')"><label for="live-${m.id}">Live Recording</label></div>
    <div class="form-row" id="venue-row-${m.id}" style="${m.live ? '' : 'display:none'}"><div class="form-group"><label>Venue</label><input name="venue" value="${esc(m.venue || '')}"></div><div class="form-group"><label>Address</label><input name="address" value="${esc(m.address || '')}"></div></div>
    <div class="form-group full"><label>Genres (click to toggle)</label><div class="genre-picker">${genreOpts}</div></div>
    <div class="form-row"><div class="form-group"><label><input type="checkbox" name="featured" ${m.featured ? 'checked' : ''}> Featured on homepage</label></div><div class="form-group"><label><input type="checkbox" name="downloadable" ${m.downloadable ? 'checked' : ''}> Downloadable</label></div></div>
    <div class="form-actions"><button type="submit" class="btn btn-primary btn-sm">Save</button><button type="button" class="btn btn-sm" onclick="cancelEdit()">Cancel</button></div>
  </form>`;
}

function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function startEdit(id) { editingId = id; render(); }
function cancelEdit() { editingId = null; render(); }

function toggleGenre(g) {
  const card = document.querySelector(`.mix-card[data-id="${editingId}"]`);
  if (!card) return;
  const input = card.querySelector('input[name="tags"]');
  // We store genres in a hidden field — use the genre picker
  const opts = card.querySelectorAll('.genre-opt');
  opts.forEach(o => { if (o.textContent === g) o.classList.toggle('selected'); });
}

function toggleLive(id) {
  const card = document.querySelector(`.mix-card[data-id="${id}"]`);
  const checked = card.querySelector('input[type="checkbox"]').checked;
  const venueRow = card.querySelector(`#venue-row-${id}`);
  if (venueRow) venueRow.style.display = checked ? '' : 'none';
}

function getSelectedGenres(card) {
  return [...card.querySelectorAll('.genre-opt.selected')].map(o => o.textContent);
}

function saveMix(e, id) {
  e.preventDefault();
  const card = document.querySelector(`.mix-card[data-id="${id}"]`);
  const form = card.querySelector('form');
  const fd = new FormData(form);
  const mix = mixes.find(m => m.id === id);
  if (!mix) return;
  mix.title = fd.get('title');
  mix.date = fd.get('date');
  mix.duration = fd.get('duration');
  mix.bpmRange = fd.get('bpmRange');
  mix.trackCount = parseInt(fd.get('trackCount')) || 0;
  mix.audioFile = fd.get('audioFile');
  mix.coverImage = fd.get('coverImage');
  mix.tags = fd.get('tags').split(',').map(t => t.trim()).filter(Boolean);
  mix.description = fd.get('description');
  mix.live = fd.get('live') === 'on';
  mix.venue = fd.get('venue');
  mix.address = fd.get('address');
  mix.genre = getSelectedGenres(card);
  mix.featured = fd.get('featured') === 'on';
  mix.downloadable = fd.get('downloadable') === 'on';
  
  // Deduplicate: remove any other mix with the same title (case-insensitive)
  const titleLower = mix.title.trim().toLowerCase();
  const dupes = mixes.filter(m => m.id !== mix.id && m.title.trim().toLowerCase() === titleLower);
  if (dupes.length > 0) {
    mixes = mixes.filter(m => m.id === mix.id || m.title.trim().toLowerCase() !== titleLower);
    toast(`Removed ${dupes.length} duplicate(s) of "${mix.title}"`, 'success');
  }
  
  save();
  editingId = null;
  render();
  toast('Mix saved! Export markdown to update the site.', 'success');
}

function deleteMix(id) {
  if (!confirm('Delete this mix?')) return;
  mixes = mixes.filter(m => m.id !== id);
  save(); render();
  toast('Mix deleted.', 'success');
}

function previewMd(id) {
  const m = mixes.find(x => x.id === id);
  if (!m) return;
  const md = generateMarkdown(m);
  document.getElementById('previewContent').textContent = md;
  document.getElementById('previewModal').classList.add('open');
}

function generateMarkdown(m) {
  return `---
title: "${m.title}"
description: "${m.description || ''}"
date: ${m.date || ''}
genre: [${(m.genre || []).map(g => `"${g}"`).join(', ')}]
duration: "${m.duration || ''}"
bpmRange: "${m.bpmRange || ''}"
trackCount: ${m.trackCount || 0}
live: ${m.live ? 'true' : 'false'}
venue: "${m.venue || ''}"
address: "${m.address || ''}"
coverImage: "${m.coverImage || ''}"
audioFile: "${m.audioFile || ''}"
downloadable: ${m.downloadable ? 'true' : 'false'}
featured: ${m.featured ? 'true' : 'false'}
tags: [${(m.tags || []).map(t => `"${t}"`).join(', ')}]
youtubeUrl: "https://youtube.com/@youknowmeasdubbz"
soundcloudUrl: "https://soundcloud.com/youknowmeasdubbz"
---`;
}

function exportAll() {
  const all = mixes.map(m => generateMarkdown(m)).join('\n\n---\n\n');
  const blob = new Blob([all], {type: 'text/markdown'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'all-mixes.md';
  a.click();
  toast('All mixes exported as markdown.', 'success');
}

function copyMd() {
  const content = document.getElementById('previewContent').textContent;
  navigator.clipboard.writeText(content).then(() => toast('Copied to clipboard!', 'success'));
}

function downloadMd() {
  const content = document.getElementById('previewContent').textContent;
  const blob = new Blob([content], {type: 'text/markdown'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'mix.md';
  a.click();
}

function toast(msg, type) {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

document.getElementById('btnAddNew').onclick = () => {
  const id = 'mix-' + Date.now();
  const newMix = {id, title:'New Mix', description:'', date:new Date().toISOString().slice(0,10), genre:[], duration:'', trackCount:0, live:false, venue:'', address:'', coverImage:'', audioFile:'', featured:false, downloadable:false, tags:[], bpmRange:''};
  
  // Check for duplicate title
  const titleLower = newMix.title.trim().toLowerCase();
  const existing = mixes.find(m => m.title.trim().toLowerCase() === titleLower);
  if (existing) {
    toast('A mix with this title already exists. Edit it instead.', 'error');
    return;
  }
  
  mixes.push(newMix);
  save(); render();
  startEdit(id);
};
document.getElementById('btnExportAll').onclick = exportAll;
document.getElementById('btnFetchAPI').onclick = async () => { await init(); toast('Refreshed from API.', 'success'); };
document.getElementById('btnClosePreview').onclick = () => document.getElementById('previewModal').classList.remove('open');
document.getElementById('btnCopyMd').onclick = copyMd;
document.getElementById('btnDownloadMd').onclick = downloadMd;

init();
</script>
</body>
</html>
