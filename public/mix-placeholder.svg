<svg viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
  <title id="title">Dubbz Mix Archive placeholder artwork</title>
  <desc id="desc">Navy and cyan turntable-inspired album art for a Dubbz mix.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.52" stop-color="#15132d"/>
      <stop offset="1" stop-color="#23143a"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="46%" r="52%">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0.22"/>
      <stop offset="0.62" stop-color="#00d4ff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#ffd700"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" fill="url(#halo)"/>
  <path d="M0 170H1200M0 1030H1200M170 0V1200M1030 0V1200" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
  <circle cx="600" cy="570" r="300" fill="#0b1020" stroke="#00d4ff" stroke-opacity="0.55" stroke-width="5"/>
  <circle cx="600" cy="570" r="252" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3" stroke-dasharray="4 18"/>
  <circle cx="600" cy="570" r="176" fill="none" stroke="url(#accent)" stroke-width="12" filter="url(#glow)"/>
  <circle cx="600" cy="570" r="42" fill="#00d4ff"/>
  <circle cx="600" cy="570" r="14" fill="#0b1020"/>
  <path d="M600 570L820 382" stroke="#ffd700" stroke-width="12" stroke-linecap="round"/>
  <circle cx="824" cy="378" r="20" fill="#ffd700"/>
  <g fill="url(#accent)">
    <rect x="338" y="930" width="18" height="74" rx="9"/>
    <rect x="374" y="900" width="18" height="104" rx="9"/>
    <rect x="410" y="866" width="18" height="138" rx="9"/>
    <rect x="446" y="914" width="18" height="90" rx="9"/>
    <rect x="482" y="846" width="18" height="158" rx="9"/>
    <rect x="700" y="892" width="18" height="112" rx="9"/>
    <rect x="736" y="850" width="18" height="154" rx="9"/>
    <rect x="772" y="916" width="18" height="88" rx="9"/>
    <rect x="808" y="874" width="18" height="130" rx="9"/>
    <rect x="844" y="932" width="18" height="72" rx="9"/>
  </g>
  <text x="600" y="112" fill="#ffd700" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="12" text-anchor="middle">DUBBZ</text>
  <text x="600" y="1145" fill="#ffffff" fill-opacity="0.82" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="8" text-anchor="middle">MIX ARCHIVE</text>
</svg>
